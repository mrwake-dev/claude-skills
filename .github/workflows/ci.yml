name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      # --strict also fails on warnings the runtime tolerates, such as an unknown field or a skill without a description.
      - name: Validate the marketplace and every plugin it lists
        run: |
          status=0
          claude plugin validate --strict . || status=1
          for source in $(jq -r '.plugins[].source' .claude-plugin/marketplace.json); do
            claude plugin validate --strict "$source" || status=1
          done
          for dir in plugins/*/; do
            jq -e --arg source "./${dir%/}" 'any(.plugins[]; .source == $source)' .claude-plugin/marketplace.json > /dev/null \
              || { echo "::error file=.claude-plugin/marketplace.json::${dir%/} is not listed in the marketplace"; status=1; }
          done
          exit $status

      - name: Check that skill and agent names match their files
        run: |
          status=0
          for file in plugins/*/skills/*/SKILL.md plugins/*/agents/*.md; do
            case "$file" in
              */SKILL.md) want="$(basename "$(dirname "$file")")" ;;
              *) want="$(basename "$file" .md)" ;;
            esac
            name="$(awk 'NR == 1 && $0 != "---" { exit } NR > 1 && $0 == "---" { exit } NR > 1 && /^name:/ { sub(/^name:[ \t]*/, ""); print; exit }' "$file")"
            if [ "$name" != "$want" ] || ! [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error file=$file::name is \"$name\"; it should be \"$want\", in lowercase letters, digits and hyphens"
              status=1
            fi
          done
          exit $status

  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Relative links and #headings only; external URLs are skipped so the check never fails on someone else's outage.
      - name: Check links to files and headings
        run: |
          python3 - <<'EOF'
          import os, re, subprocess, sys
          
          def blank(m):
              return re.sub(r"[^\n]", " ", m.group(0))
          
          def strip_fences(text):
              return re.sub(r"^ *(```|~~~).*?^ *\1[^\n]*$", blank, text, flags=re.S | re.M)
          
          def strip_code(text):
              return re.sub(r"`[^`\n]+`", blank, strip_fences(text))
          
          def anchors(path, cache={}):
              if path not in cache:
                  text = strip_fences(open(path, encoding="utf-8").read())
                  seen, found = {}, set(re.findall(r'(?:id|name)="([^"]+)"', strip_code(text)))
                  for title in re.findall(r"^#{1,6}[ \t]+(.+?)[ \t]*#*$", text, flags=re.M):
                      title = re.sub(r"\[([^\]]*)\]\([^)]*\)", r"\1", title).replace("`", "")
                      slug = re.sub(r"[^\w\- ]", "", title.lower()).replace(" ", "-")
                      n = seen.get(slug, 0); seen[slug] = n + 1
                      found.add(slug if n == 0 else f"{slug}-{n}")
                  cache[path] = found
              return cache[path]
          
          files = subprocess.run(["git", "ls-files", "*.md"], capture_output=True, text=True, check=True).stdout.split()
          errors = 0
          for path in files:
              raw = open(path, encoding="utf-8").read()
              text = strip_code(raw)
              links = [(m.start(1), m.group(1)) for m in re.finditer(r"!?\[[^\]]*\]\(([^)\s]+)(?:\s+\"[^\"]*\")?\)", text)]
              links += [(m.start(1), m.group(1)) for m in re.finditer(r'(?:href|src)="([^"]+)"', text)]
              for pos, link in links:
                  if re.match(r"^[a-z][a-z0-9+.-]*:", link, re.I):
                      continue
                  target, _, fragment = link.partition("#")
                  resolved = os.path.normpath(os.path.join(os.path.dirname(path), target)) if target else path
                  line = raw.count("\n", 0, pos) + 1
                  if not os.path.exists(resolved):
                      problem = f"{link} points to a missing file"
                  elif fragment and resolved.endswith(".md") and fragment.lower() not in anchors(resolved):
                      problem = f"{link} points to a missing heading"
                  else:
                      continue
                  print(f"::error file={path},line={line}::{problem}")
                  errors += 1
          print(f"{len(files)} Markdown files checked, {errors} broken links")
          sys.exit(1 if errors else 0)
          EOF
