<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TITLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
	--bg: #0b0b10;
	--surface: #16161f;
	--surface-2: #1e1e2a;
	--border: rgba(255, 255, 255, 0.08);
	--border-strong: rgba(255, 255, 255, 0.14);
	--text: #ececf1;
	--muted: #9a9aab;
	--accent: #8b7cf6;
	--accent-soft: rgba(139, 124, 246, 0.14);
	--on-accent: #0b0b10;
	--c1: #8b7cf6;
	--c2: #4cc9f0;
	--c3: #f5b84c;
	--c4: #f2708a;
	--ok: #5ad19a;
	--warn: #f5b84c;
	--bad: #f2708a;
	--ok-soft: rgba(90, 209, 154, 0.12);
	--warn-soft: rgba(245, 184, 76, 0.12);
	--bad-soft: rgba(242, 112, 138, 0.12);
	--font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	--radius: 10px;
	--radius-sm: 6px;
	--space: 8px;
	--page: 1120px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
	margin: 0;
	background:
		radial-gradient(1100px 480px at 15% -12%, rgba(139, 124, 246, 0.13), transparent 62%),
		var(--bg);
	background-attachment: fixed;
	color: var(--text);
	font: 400 15px/1.6 var(--font-ui);
	-webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

.page { max-width: var(--page); margin: 0 auto; padding: calc(var(--space) * 7) calc(var(--space) * 3) calc(var(--space) * 10); }
section { margin-top: calc(var(--space) * 7); scroll-margin-top: calc(var(--space) * 3); }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
h1 { font-size: clamp(28px, 4.2vw, 40px); }
h2 { font-size: 20px; margin-bottom: calc(var(--space) * 2); }
h3 { font-size: 15px; margin-bottom: var(--space); }
p { margin: 0 0 calc(var(--space) * 1.5); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: calc(var(--space) * 1.5); }
.lead { color: var(--text); font-size: 18px; max-width: 72ch; margin-top: calc(var(--space) * 2); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: calc(var(--space) * 2); color: var(--muted); font-size: 13px; }
.toc { display: flex; flex-wrap: wrap; gap: var(--space); margin-top: calc(var(--space) * 3); }
.toc a { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); font-size: 13px; }
.toc a:hover { color: var(--text); border-color: var(--border-strong); text-decoration: none; }

/* Layout */
.grid { display: grid; gap: calc(var(--space) * 2); grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--space) * 2.5); }
.card--accent { border-color: rgba(139, 124, 246, 0.45); box-shadow: 0 0 0 1px rgba(139, 124, 246, 0.15), 0 12px 40px -16px rgba(139, 124, 246, 0.35); }

/* Stats */
.stats { display: grid; gap: calc(var(--space) * 2); grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: calc(var(--space) * 4); }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--space) * 2) calc(var(--space) * 2.5); }
.stat__label { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.stat__value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat__delta { font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--muted); }
.stat__delta.up { color: var(--ok); }
.stat__delta.down { color: var(--bad); }

/* Table */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Badges and callouts */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.badge--warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.badge--bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.badge--accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.callout { border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); border-radius: var(--radius-sm); padding: calc(var(--space) * 1.5) calc(var(--space) * 2); }
.callout--warn { border-left-color: var(--warn); }
.callout--bad { border-left-color: var(--bad); }
.callout__title { font-weight: 600; margin-bottom: 4px; }

/* Code and diffs */
code { font: 500 0.88em/1.5 var(--font-mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
pre { margin: 0; overflow-x: auto; }
.code { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font: 400 13px/1.65 var(--font-mono); }
.code__head { display: flex; justify-content: space-between; gap: var(--space); padding: 8px 14px; border-bottom: 1px solid var(--border); color: var(--muted); font: 500 12px/1.4 var(--font-mono); }
.code pre { padding: 12px 0; }
.code .ln { display: block; padding: 0 14px; white-space: pre; }
.code .ln--add { background: var(--ok-soft); box-shadow: inset 3px 0 0 var(--ok); }
.code .ln--del { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.code .ln--hunk { color: var(--muted); }
.annotated { display: grid; gap: calc(var(--space) * 2); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.note { border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; font-size: 14px; }
.note + .note { margin-top: calc(var(--space) * 2); }
.note--warn { border-left-color: var(--warn); }
.note--bad { border-left-color: var(--bad); }

/* Progress and checklists */
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.checklist li::before { content: ""; flex: none; width: 16px; height: 16px; margin-top: 3px; border-radius: 4px; border: 1.5px solid var(--border-strong); }
.checklist li.done { color: var(--muted); }
.checklist li.done::before { background: var(--accent); border-color: var(--accent); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--border-strong); }
.timeline li { position: relative; padding: 0 0 calc(var(--space) * 2.5) 6px; }
.timeline li::before { content: ""; position: absolute; left: -24px; top: 7px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.timeline time { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Charts (inline SVG) */
.chart { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: calc(var(--space) * 2.5); }
.chart__title { font-weight: 600; }
.chart__sub { color: var(--muted); font-size: 13px; margin-bottom: calc(var(--space) * 2); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { fill: var(--muted); font: 500 11px var(--font-ui); font-variant-numeric: tabular-nums; }
.chart svg .grid-line { stroke: var(--border); }
.chart svg .label-strong { fill: var(--text); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: calc(var(--space) * 1.5); color: var(--muted); font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Bar charts in HTML so labels keep their size on phones */
.bars { display: grid; gap: 10px; }
.bars__row { display: grid; grid-template-columns: minmax(84px, 10rem) minmax(0, 1fr) minmax(3.5rem, auto); align-items: center; gap: 12px; font-size: 13px; }
.bars__label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars__track { position: relative; height: 18px; background: var(--surface-2); border-radius: 4px; }
.bars__fill { position: absolute; top: 0; bottom: 0; left: 0; width: var(--v, 0%); background: var(--accent); border-radius: 4px; }
.bars__fill--muted { background: var(--border-strong); }
.bars__fill--c2 { background: var(--c2); }
.bars__fill--c3 { background: var(--c3); }
.bars__fill--c4 { background: var(--c4); }
.bars__fill--ok { background: var(--ok); }
.bars__fill--bad { background: var(--bad); }
.bars__mark { position: absolute; top: -4px; bottom: -4px; left: var(--at); border-left: 1.5px dashed var(--muted); }
.bars__value { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) {
	.bars__row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
	.bars__track { grid-column: 1 / -1; grid-row: 2; }
}

/* Line charts: SVG marks stretched to the plot, labels in HTML */
.linechart__body { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 180px auto; column-gap: 10px; }
.linechart__body svg { width: 100%; height: 100%; }
.linechart__y { display: flex; flex-direction: column; justify-content: space-between; margin: -0.6em 0; color: var(--muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.linechart__x { grid-column: 2; display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font: 500 13px var(--font-ui); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
input[type="range"] { accent-color: var(--accent); width: 100%; }

footer { margin-top: calc(var(--space) * 8); padding-top: calc(var(--space) * 2); border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
footer ol { margin: 6px 0 0; padding-left: 18px; }

@media (max-width: 760px) {
	.page { padding: calc(var(--space) * 4) calc(var(--space) * 2) calc(var(--space) * 6); }
	.annotated { grid-template-columns: minmax(0, 1fr); }
	.lead { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
	.card, .stat, .btn, .toc a { transition: border-color 0.15s ease, color 0.15s ease; }
}
</style>
</head>
<body>
<main class="page">
	<header>
		<div class="eyebrow">EYEBROW</div>
		<h1>TITLE</h1>
		<p class="lead">LEAD — the answer in one or two sentences, with its key number.</p>
		<div class="meta"><span>As of DATE</span><span>Source: SOURCE</span></div>
	</header>

	<!-- Sections go here; component markup is in references/design.md. -->

	<footer>
		<div>Sources</div>
		<ol><li>SOURCE</li></ol>
	</footer>
</main>
</body>
</html>
